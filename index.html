<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NeuroArena</title>
<meta name="description" content="Juego para practicar cómo aprende el cerebro y cómo comunicar: simulador de charla, concurso, aventura y cartas.">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NeuroArena">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{--bg:#0a0a0b;--bg2:#101013;--panel:#141418;--panel2:#1b1b21;--line:#26262d;--tx:#e8e8ec;--mu:#9a9aa5;--am:#f59e0b;--amd:#b45309;--cy:#06b6d4;--cyd:#0e7490;--ok:#22c55e;--bad:#ef4444;--r:14px;
--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right);
--serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}html.big{font-size:18.5px}
body{margin:0;background:var(--bg);color:var(--tx);font:1rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--cy)}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) calc(14px + var(--sar)) 10px calc(14px + var(--sal));background:rgba(10,10,11,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--am),var(--cy));display:grid;place-items:center;font-size:17px}
header.top h1{font-size:1.02rem;margin:0;flex:1;letter-spacing:.3px}
header.top h1 b{color:var(--am)}
.ib{background:var(--panel2);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:17px}
main{padding:16px calc(14px + var(--sar)) calc(96px + var(--sab)) calc(14px + var(--sal));max-width:760px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:rgba(16,16,19,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px calc(4px + var(--sar)) calc(6px + var(--sab)) calc(4px + var(--sal))}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--mu);border-radius:10px}
nav.tabs button span{font-size:1.3rem;line-height:1}
nav.tabs button.on{color:var(--am);background:rgba(245,158,11,.08)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2,.card h3{margin:0 0 8px}
h2{font-size:1.3rem}h3{font-size:1.08rem}
.muted{color:var(--mu)}.small{font-size:.86rem}.mono{font-family:var(--mono)}
.am{color:var(--am)}.cy{color:var(--cy)}.okc{color:var(--ok)}.badc{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:11px 16px;font-weight:600;min-height:46px}
.btn.pri{background:var(--am);color:#111;border-color:var(--am)}
.btn.sec{background:transparent;border-color:var(--cy);color:var(--cy)}
.btn.full{width:100%}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--mono);font-size:1.45rem;color:var(--am)}
.stat span{font-size:.8rem;color:var(--mu)}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--am),var(--cy));border-radius:99px;transition:width .5s}
.mod{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);margin-bottom:10px;width:100%;text-align:left}
.mod .ic{font-size:1.8rem;width:50px;height:50px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;flex:none}
.mod .t{font-weight:700}.mod .s{font-size:.84rem;color:var(--mu)}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mu);font-family:var(--mono)}
.tag.ok{border-color:var(--ok);color:var(--ok)}.tag.am{border-color:var(--am);color:var(--am)}
/* lección */
.lesson-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 14px}
.dots i{width:22px;height:5px;border-radius:9px;background:var(--line)}
.dots i.r{background:var(--cyd)}.dots i.c{background:var(--am)}
.lesson h2{font-size:1.4rem;line-height:1.25;margin:4px 0 12px}
.lesson p,.lesson li{font-size:1.02rem}
.lesson ul,.lesson ol{padding-left:22px}
.lesson li{margin-bottom:6px}
.relato{font-family:var(--serif);font-size:1.12rem;line-height:1.75}
.relato p{margin:0 0 14px}
.relato .dlg{font-style:italic;color:#f3e2c0;padding-left:14px;border-left:2px solid var(--amd)}
.drop::first-letter{float:left;font-size:3.6em;line-height:.85;padding:6px 8px 0 0;color:var(--am);font-weight:700}
.chap{font-family:var(--mono);font-size:.78rem;letter-spacing:2px;color:var(--cy);text-transform:uppercase}
.callout{border-radius:12px;padding:12px 14px;margin:14px 0;border:1px solid}
.callout.amber{background:rgba(245,158,11,.07);border-color:rgba(245,158,11,.35)}
.callout.cyan{background:rgba(6,182,212,.07);border-color:rgba(6,182,212,.35)}
.callout ul{margin:6px 0 0}
.dato{background:linear-gradient(135deg,rgba(168,85,247,.1),rgba(6,182,212,.06));border:1px dashed rgba(168,85,247,.5);border-radius:12px;padding:12px 14px;margin:16px 0}
.dato h5,.tip h5{margin:0 0 4px;font-size:.8rem;letter-spacing:1.5px;text-transform:uppercase}
.dato h5{color:#c084fc}.tip h5{color:var(--ok)}
.tip{background:rgba(34,197,94,.07);border-left:3px solid var(--ok);border-radius:0 12px 12px 0;padding:10px 14px;margin:16px 0}
.gancho{font-family:var(--serif);font-style:italic;color:var(--am);font-size:1.05rem;margin:18px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
.gancho::before{content:"➜ ";font-style:normal}
.myth{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.35);border-radius:10px;padding:10px 12px;font-style:italic}
.bigq{font-family:var(--serif);font-size:1.35rem;text-align:center;padding:16px;border:1px solid var(--am);border-radius:12px;margin:12px 0;color:var(--am)}
.pillars{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.pillars div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.pillars b{color:var(--am);display:block}.pillars span{font-size:.88rem;color:var(--mu)}
ol.steps li::marker{color:var(--am);font-weight:700}
.tech{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.tech h4{margin:0 0 6px;color:var(--cy)}
.tech .ej{font-family:var(--serif);font-style:italic;color:#f3e2c0;margin:6px 0 0}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;margin:10px 0}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px;text-align:left;vertical-align:top}
.tbl th{background:var(--panel2);color:var(--am)}
.checklist h4{color:var(--cy);margin:12px 0 6px}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.checklist input{width:20px;height:20px;accent-color:var(--am);flex:none;margin-top:3px}
.check{background:var(--bg2);border:1px solid var(--cyd);border-radius:12px;padding:12px 14px;margin-top:18px}
.check .q{font-weight:600}.check .ans{margin-top:8px;color:var(--cy);display:none}.check.open .ans{display:block}
.navrow{display:flex;gap:10px;margin-top:18px}.navrow .btn{flex:1}
.speak{font-size:.85rem;padding:6px 10px;min-height:34px}
/* widgets */
.w{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;margin:12px 0}
.w svg{width:100%;height:auto;display:block}
.zone{cursor:pointer;transition:opacity .2s;opacity:.55}.zone:hover,.zone.on{opacity:.95}
.winfo{min-height:72px;padding:10px;border-radius:10px;background:var(--panel2);margin-top:8px;font-size:.93rem}
.winfo b{display:block;margin-bottom:2px}
.flow{display:flex;flex-direction:column;gap:6px}
.flow button{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left}
.flow button.on{border-color:var(--am);background:rgba(245,158,11,.08)}
.flow .ar{text-align:center;color:var(--mu);line-height:1;font-size:.8rem}
.flow .fi{font-size:1.4rem}
.seg{display:flex;gap:6px;margin-top:8px}.seg button{flex:1;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:.85rem}
.seg button.on{border-color:var(--cy);color:var(--cy)}
.tl{display:flex;flex-direction:column;gap:6px}
.tl .m{display:grid;grid-template-columns:62px 1fr;gap:10px;background:var(--panel2);border-radius:10px;padding:10px;border-left:4px solid var(--am)}
.tl .m:nth-child(even){border-left-color:var(--cy)}
.tl .m b{font-family:var(--mono);color:var(--am)}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.qp{font-size:1.12rem;font-weight:600;margin:8px 0 14px;line-height:1.45}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:9px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:1rem}
.opt.ok{border-color:var(--ok);background:rgba(34,197,94,.12)}
.opt.bad{border-color:var(--bad);background:rgba(239,68,68,.12)}
.opt.sel{border-color:var(--cy)}
.opt:disabled{opacity:1}
.ordlist .opt{display:flex;gap:10px;align-items:center}
.ordlist .n{font-family:var(--mono);color:var(--am);min-width:22px}
.fb{border-radius:12px;padding:12px;margin:10px 0;font-size:.95rem}
.fb.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.4)}
.fb.bad{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.4)}
.big-score{font-family:var(--mono);font-size:3rem;font-weight:800;text-align:center;color:var(--am);line-height:1.1}
/* flashcards */
.flash{perspective:1000px;height:260px;margin:12px 0}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash.flip .in{transform:rotateY(180deg)}
.flash .fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line)}
.flash .front{background:linear-gradient(160deg,var(--panel2),var(--panel));font-size:1.2rem;font-weight:700}
.flash .back{background:linear-gradient(160deg,#0b2a30,var(--panel));transform:rotateY(180deg);font-size:1.02rem}
.flash small{position:absolute;top:10px;left:14px;font-size:.72rem;color:var(--mu);font-family:var(--mono)}
.boxes{display:flex;gap:6px}.boxes div{flex:1;text-align:center;background:var(--panel2);border-radius:10px;padding:8px 2px;border:1px solid var(--line)}
.boxes b{display:block;font-family:var(--mono);color:var(--cy);font-size:1.1rem}.boxes span{font-size:.7rem;color:var(--mu)}
/* forms */
label.f{display:block;font-size:.85rem;color:var(--mu);margin:10px 0 4px}
input.t,textarea.t,select.t{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--tx);font:inherit}
textarea.t{min-height:70px;resize:vertical}
.rub{border-bottom:1px solid var(--line);padding:10px 0}
.rub .lv{display:flex;gap:6px;margin-top:6px}
.rub .lv button{flex:1;padding:8px 0;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-family:var(--mono)}
.rub .lv button.on{background:var(--am);color:#111;border-color:var(--am)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.tg{width:50px;height:28px;border-radius:99px;background:var(--line);position:relative;border:0;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--am)}.tg.on::after{left:25px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--am);padding:10px 16px;border-radius:12px;z-index:50;font-size:.92rem;max-width:90vw;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.ring{width:110px;height:110px;flex:none}
.hero{display:flex;gap:16px;align-items:center}
.chart{width:100%;height:auto}
.fade{animation:fd .3s}@keyframes fd{from{opacity:0;transform:translateY(6px)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;display:grid;place-items:center;padding:calc(20px + var(--sat)) 16px calc(20px + var(--sab))}
.modal .card{max-width:520px;width:100%;max-height:85vh;overflow:auto}
pre.guion{white-space:pre-wrap;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);font-size:.85rem}
/* ===== Juego ===== */
.lvl{display:flex;align-items:center;gap:12px}
.lvl .badge{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,var(--am),var(--cy));display:grid;place-items:center;font-family:var(--mono);font-weight:800;font-size:1.3rem;color:#111;flex:none}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mode{border-radius:16px;padding:14px;border:1px solid var(--line);text-align:left;min-height:150px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.mode .mi{font-size:2rem}.mode b{font-size:1.02rem}.mode span{font-size:.78rem;color:#d4d4d8}
.mode .best{margin-top:auto;font-family:var(--mono);font-size:.75rem;color:#fff;opacity:.85}
.m1{background:linear-gradient(150deg,#3b1d06,#141418)}.m2{background:linear-gradient(150deg,#06303a,#141418)}.m3{background:linear-gradient(150deg,#2a1240,#141418)}.m4{background:linear-gradient(150deg,#0b3320,#141418)}
.logros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.logro{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:.66rem;color:var(--mu)}
.logro i{display:block;font-style:normal;font-size:1.6rem;filter:grayscale(1);opacity:.35}
.logro.on{border-color:var(--am);color:var(--tx)}.logro.on i{filter:none;opacity:1}
.meters{display:grid;gap:6px;margin-bottom:10px}
.meter{display:grid;grid-template-columns:96px 1fr 34px;gap:8px;align-items:center;font-size:.8rem}
.meter .bar i{transition:width .6s}
.meter b{font-family:var(--mono);text-align:right}
.aud{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;font-size:1.55rem;text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;margin-bottom:12px}
.aud span{transition:transform .3s}.aud span.pop{transform:scale(1.25)}
.sit{font-family:var(--serif);font-size:1.12rem;line-height:1.55;margin:4px 0 12px}
.delta{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.delta span{font-family:var(--mono);font-size:.8rem;padding:3px 8px;border-radius:8px;background:var(--panel2)}
.up{color:var(--ok)}.dn{color:var(--bad)}
.stars{font-size:2.4rem;text-align:center;letter-spacing:6px}
.timer{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--am),var(--ok));transition:width .25s linear}
.lifelines{display:flex;gap:8px;margin:10px 0}.lifelines button{flex:1;padding:9px 4px;border-radius:10px;border:1px solid var(--cy);background:transparent;color:var(--cy);font-size:.82rem}
.lifelines button:disabled{opacity:.3;border-color:var(--line);color:var(--mu)}
.hearts{font-size:1.15rem;letter-spacing:2px}
.map{position:relative;padding:6px 0}
.znode{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin:0 0 4px}
.znode .zi{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:var(--panel2);border:2px solid var(--line);flex:none}
.znode.done .zi{border-color:var(--ok);background:rgba(34,197,94,.12)}
.znode.open .zi{border-color:var(--am);box-shadow:0 0 18px rgba(245,158,11,.45);animation:pulse 1.6s infinite}
.znode.lock{opacity:.45}
.znode.jefe{border-color:#a855f7}
.zline{width:3px;height:16px;background:var(--line);margin:0 0 4px 38px}
.zline.on{background:var(--ok)}
@keyframes pulse{50%{box-shadow:0 0 4px rgba(245,158,11,.2)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:flex;flex-direction:column;gap:8px}
.match button{padding:11px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:.88rem;min-height:52px}
.match button.sel{border-color:var(--cy);background:rgba(6,182,212,.12)}
.match button.ok{border-color:var(--ok);background:rgba(34,197,94,.12);opacity:.65}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.situ{border-radius:16px;padding:16px;background:linear-gradient(150deg,#2b1a05,#141418);border:1px solid var(--amd);margin-bottom:12px}
.situ b{font-size:1.1rem;display:block;color:var(--am)}
.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tcard{border-radius:12px;border:1px solid var(--line);background:linear-gradient(170deg,#1f2a33,#141418);padding:8px 4px;text-align:center;min-height:120px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .15s}
.tcard i{font-style:normal;font-size:1.7rem}.tcard b{font-size:.68rem;line-height:1.2}
.tcard.sel{border-color:var(--am);transform:translateY(-8px);box-shadow:0 6px 18px rgba(245,158,11,.3)}
.tcard.g{border-color:var(--ok)}.tcard.x{border-color:var(--bad)}
.tdesc{min-height:44px;font-size:.86rem;color:var(--mu);margin:10px 0;text-align:center}
.combo{font-family:var(--mono);color:#c084fc;font-weight:800;font-size:1.1rem;text-align:center;animation:fd .4s}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
</style>
</head>
<body>
<header class="top"><div class="logo" onclick="go('inicio')">🎮</div><h1 onclick="go('inicio')">Neuro<b>Arena</b></h1><button class="ib" onclick="go('ajustes')" aria-label="Ajustes">⚙️</button></header>
<main id="view"></main>
<script>/* NeuroArena: datos del juego. Personajes ficticios (mismo universo que NeuroComunica). */

/* ===== MODO 1: SIMULADOR "EN ESCENA" =====
   a = atención, c = comprensión, r = retención (efectos sobre medidores 0-100) */
const ESCENARIOS=[
{id:'muelle',icono:'⚓',titulo:'Charla de 5 minutos en el muelle',ctx:'6:30 a.m. · 15 riggers y operadores · ruido de motores',obj:'Que nadie se pare debajo de una carga suspendida.',
pasos:[
{s:'Llegas al punto de reunión. Quince pares de ojos te miran sin muchas ganas. ¿Cómo empiezas?',o:[
{t:'«Buenos días. Primero firmen la lista y luego les hablo de izaje.»',a:-15,c:0,r:-5,f:'Gastaste la primacía en un trámite. La firma va al final.'},
{t:'Levantas un grillete deformado a la altura de los ojos y esperas en silencio cinco segundos.',a:20,c:5,r:10,f:'Objeto real + silencio = hueco de curiosidad. Todas las miradas en ti.'},
{t:'«Hoy vamos a revisar el procedimiento de izaje completo. Son diecinueve láminas.»',a:-20,c:-5,r:-5,f:'Anunciaste aburrimiento. Los cerebros activaron el piloto automático.'}]},
{s:'Tienes su atención. Es el momento del mensaje central.',o:[
{t:'«Hay que tener cuidado con las cargas y trabajar seguro.»',a:0,c:-10,r:-10,f:'Abstracto. Nadie sabe qué conducta concreta esperas.'},
{t:'«Nadie se para debajo de una carga suspendida.»',a:5,c:15,r:15,f:'Una conducta observable en menos de 15 palabras.'},
{t:'Lees las once normas de izaje, una por una.',a:-15,c:-10,r:-15,f:'La memoria de trabajo sostiene unas 4 cosas. Las primeras ya se cayeron.'}]},
{s:'Necesitas una prueba que haga real el mensaje.',o:[
{t:'Le pides a Teodoro que cuente el día de 2009 en que el grillete le pasó a un metro de la cabeza.',a:15,c:10,r:15,f:'Historia real y cercana: memoria episódica y cerebros sincronizados.'},
{t:'Muestras fotos de un accidente grave sacadas de internet, sin comentar nada.',a:10,c:-10,r:-5,f:'Miedo sin acción clara genera negación: «a mí no me va a pasar».'},
{t:'Citas: «según estudios, recordamos el 90% de lo que hacemos».',a:-5,c:-5,r:-5,f:'La pirámide del aprendizaje es inventada. Pierdes credibilidad con quien lo sepa.'}]},
{s:'Toca verificar que el mensaje llegó.',o:[
{t:'«¿Alguna pregunta?… ¿No? Perfecto.»',a:-5,c:-5,r:0,f:'El silencio no prueba comprensión.'},
{t:'«Wilder, muéstrame dónde te pararías cuando la grúa gire.» Y esperas.',a:10,c:15,r:15,f:'Demostración inversa: ves la conducta, corriges en el momento.'},
{t:'«¿Se entendió?» Todos dicen que sí.',a:0,c:-5,r:0,f:'Pregunta cerrada: obtienes un «sí» automático, no información.'}]},
{s:'Último minuto. El cierre es lo que más van a recordar.',o:[
{t:'«Bueno, cuídense. Ya saben.»',a:-5,c:-5,r:-10,f:'Desperdiciaste la recencia y el «final» del pico-final.'},
{t:'«¿Qué harás distinto hoy?» Dos responden. Repiten la frase en coro. «Mañana les cuento qué encontramos en la eslinga.»',a:10,c:10,r:20,f:'Compromiso, repetición, producción en voz alta y gancho a la próxima charla.'},
{t:'Repites las once normas por si acaso.',a:-15,c:-5,r:-5,f:'Saturación al final: el mensaje central queda enterrado.'}]}]},
{id:'induccion',icono:'🆕',titulo:'Inducción del primer día',ctx:'Sala de inducción · 4 trabajadores nuevos · 1 hora',obj:'Que sepan qué hacer en una emergencia y cómo detener un trabajo inseguro.',
pasos:[
{s:'Los cuatro nuevos llegan nerviosos, con el EPP recién estrenado. ¿Cómo arrancas?',o:[
{t:'Veinte minutos de historia de la empresa, misión, visión y organigrama.',a:-15,c:-5,r:-5,f:'Lo menos útil ocupa el momento de mayor atención.'},
{t:'«Si mañana suena la sirena, ¿hacia dónde corren?» Nadie sabe. Abriste el hueco.',a:15,c:5,r:10,f:'Pregunta real y vital: curiosidad y relevancia inmediata.'},
{t:'Les entregas el reglamento de 80 páginas para que lo lean en silencio.',a:-20,c:-10,r:-10,f:'Lectura pasiva, sin prioridad ni interacción.'}]},
{s:'¿Cuánto contenido das el primer día?',o:[
{t:'Los cuarenta temas del programa de inducción, rápido, para cumplir.',a:-10,c:-15,r:-15,f:'Cerebro saturado: retendrán pocos temas y al azar.'},
{t:'Cuatro temas vitales: riesgos críticos, emergencia, a quién preguntar y cómo detener un trabajo. El resto, en la semana.',a:5,c:15,r:15,f:'Lo vital primero, lo demás espaciado.'},
{t:'Lo que diga el procedimiento, en el orden del procedimiento.',a:-5,c:-5,r:-5,f:'El orden del documento no es el orden del cerebro.'}]},
{s:'¿Dónde enseñas el punto de reunión y los extintores?',o:[
{t:'En la sala, con fotos en el proyector.',a:0,c:0,r:-5,f:'Funciona, pero pierdes las llaves del contexto.'},
{t:'Recorrido por el muelle: se paran en el punto de reunión y tocan el extintor.',a:10,c:10,r:15,f:'Memoria dependiente del contexto: aprenden donde lo usarán.'},
{t:'Les pones un video de treinta minutos.',a:-10,c:-5,r:-5,f:'Pasivo y largo para un cerebro ya cansado.'}]},
{s:'Explicas el permiso de trabajo diario.',o:[
{t:'«Antes de su ATS revisen el IPERC y, si aplica, el PETAR.»',a:-5,c:-15,r:-5,f:'Maldición del conocimiento: cuatro siglas en una frase.'},
{t:'«Antes de empezar llenan una hoja llamada ATS: una lista de qué puede salir mal y cómo evitarlo.»',a:5,c:15,r:5,f:'Defines la sigla la primera vez y con palabras simples.'},
{t:'«Cualquier duda, pregunten a cualquiera.»',a:0,c:-5,r:0,f:'Sin un referente claro, la duda se queda callada.'}]},
{s:'¿Cómo cierras el primer día?',o:[
{t:'Examen escrito de treinta preguntas en ese momento.',a:-5,c:0,r:0,f:'Evaluar el mismo día mide lo que entró, no lo que se quedó.'},
{t:'Les asignas un acompañante y anuncias que mañana y en tres días les preguntarás lo vital.',a:5,c:5,r:20,f:'Acompañamiento + repaso espaciado programado.'},
{t:'Firman la lista y a trabajar.',a:0,c:-5,r:-10,f:'La firma prueba asistencia, no aprendizaje.'}]}]},
{id:'arnes',icono:'🪢',titulo:'Capacitación práctica: arnés',ctx:'Taller · 8 trabajadores · 45 minutos',obj:'Que se coloquen y revisen el arnés correctamente.',
pasos:[
{s:'Empiezas la capacitación práctica.',o:[
{t:'Explicas la norma técnica del arnés en veinticinco láminas.',a:-15,c:-5,r:-10,f:'Una habilidad no se aprende con láminas.'},
{t:'Preguntas quién ha usado arnés y qué le incomodó. Partes de su experiencia.',a:10,c:5,r:5,f:'Paso 1 del método TWI: preparar y anclar a lo que ya saben.'},
{t:'Repartes los arneses y que cada uno se lo ponga como sepa.',a:5,c:-10,r:-5,f:'Sin modelo previo, cada uno repite sus errores.'}]},
{s:'Presentas la operación.',o:[
{t:'Te lo pones tú lentamente, paso a paso, diciendo el porqué de cada punto clave.',a:10,c:15,r:10,f:'Paso 2 de TWI: mostrar con puntos clave y razones.'},
{t:'Pones un video de internet en inglés.',a:0,c:-10,r:-5,f:'Idioma ajeno: sin comprensión no hay acople.'},
{t:'Lo describes con palabras, sin mostrarlo.',a:-5,c:-10,r:-10,f:'La memoria procedimental necesita ver y hacer.'}]},
{s:'Hora de practicar.',o:[
{t:'Cada uno se lo pone diciendo en voz alta los puntos clave. Corriges en el momento.',a:10,c:15,r:20,f:'Práctica + producción en voz alta + retroalimentación inmediata.'},
{t:'Uno pasa al frente y los demás miran.',a:-5,c:0,r:-5,f:'Siete personas sin practicar.'},
{t:'No hay tiempo: pasas al tema siguiente.',a:-5,c:-10,r:-15,f:'Sin práctica, no hay habilidad.'}]},
{s:'Un veterano, muy seguro, deja suelta la correa de las piernas.',o:[
{t:'Lo corriges con burla frente a todos.',a:-5,c:-5,r:0,f:'Aprendió a esconder sus errores, no a corregirlos.'},
{t:'«¿Qué pasaría si caes así?» Lo piensa, se sorprende, le explicas con calma.',a:5,c:10,r:15,f:'Efecto de hipercorrección: error seguro + corrección = recuerdo fuerte.'},
{t:'Lo dejas pasar para no incomodarlo.',a:0,c:-15,r:-10,f:'El error no corregido se va al frente de trabajo.'}]},
{s:'Terminó la sesión.',o:[
{t:'Firman la lista y listo.',a:0,c:0,r:-10,f:'Ninguna evidencia de aplicación.'},
{t:'Programas observarlos en campo la próxima semana.',a:5,c:5,r:15,f:'Paso 4 de TWI y nivel 3 de Kirkpatrick.'},
{t:'Mandas el procedimiento por WhatsApp.',a:0,c:0,r:0,f:'Información disponible no es información aprendida.'}]}]},
{id:'leccion',icono:'📣',titulo:'Lección aprendida: la tubería que giró',ctx:'Comedor · 20 trabajadores · 10 minutos',obj:'Que siempre haya alguien controlando la soga guía y nadie se acerque a la carga.',
pasos:[
{s:'¿Cómo empiezas a contar el incidente?',o:[
{t:'«Wilder casi provoca un accidente por descuidado.»',a:5,c:-10,r:-5,f:'Culpar en público activa defensas en todos.'},
{t:'En presente, desde los ojos del rigger: «Son las diez y doce. La tubería sube. El viento empieza a girarla…»',a:15,c:10,r:10,f:'Narrativa concreta con detalle exacto: el público se mete en la escena.'},
{t:'Lees el informe de investigación completo.',a:-15,c:-5,r:-5,f:'Formato pensado para archivar, no para recordar.'}]},
{s:'La tubería está girando. Detienes el relato.',o:[
{t:'«¿Qué habrían hecho ustedes en ese momento?» Y esperas.',a:10,c:10,r:10,f:'Contrarresta el sesgo retrospectivo y activa el compromiso.'},
{t:'«Era obvio que iba a pasar.»',a:0,c:-5,r:-5,f:'Sesgo retrospectivo: para quien estaba ahí, no era obvio.'},
{t:'Muestras quince fotos del área.',a:0,c:-5,r:0,f:'Carga extraña sin un foco claro.'}]},
{s:'¿Qué explicas después?',o:[
{t:'Qué barrera falló (nadie controlaba la soga guía) y qué cambia: un vigía asignado a la soga en cada maniobra.',a:5,c:15,r:10,f:'Causa + cambio concreto.'},
{t:'Anuncias sanciones para el próximo que lo haga.',a:5,c:-5,r:-5,f:'Amenaza sin eficacia: la gente oculta en vez de reportar.'},
{t:'«Tengan más cuidado.»',a:-5,c:-10,r:-5,f:'Vago. No hay conducta que observar.'}]},
{s:'El ambiente está tenso.',o:[
{t:'Confiesas: «Yo también he jalado una soga con una mano y el celular en la otra.»',a:10,c:5,r:5,f:'Confesión con humor: bajan las defensas y sube la confianza.'},
{t:'Haces bromas sobre Wilder.',a:5,c:-10,r:-5,f:'La burla destruye la seguridad psicológica.'},
{t:'Mantienes la seriedad total, sin respiro.',a:-5,c:0,r:0,f:'Sin pausa emocional, la atención decae.'}]},
{s:'Cierre.',o:[
{t:'Cada vigía dice en voz alta qué hará en la próxima maniobra. Repites la regla.',a:5,c:10,r:15,f:'Compromiso público y producción.'},
{t:'Envías el informe por correo.',a:0,c:0,r:-5,f:'Sin cierre, no hay recencia.'},
{t:'«Eso es todo.»',a:-5,c:-5,r:-10,f:'Final plano, recuerdo plano.'}]}]}
];

/* ========== Persistencia (IndexedDB, patrón repositorio) ========== */
const DB={db:null,ok:false,open(){return new Promise(res=>{try{const r=indexedDB.open('neuroarena',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv',{keyPath:'k'});r.onsuccess=()=>{this.db=r.result;this.ok=true;res()};r.onerror=()=>res()}catch(e){res()}})}};
const Repo={mem:new Map(),
  get(k){if(!DB.ok)return Promise.resolve(this.mem.get(k));return new Promise(res=>{const q=DB.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res()})},
  put(v){if(!DB.ok){this.mem.set(v.k,v);return Promise.resolve()}return new Promise(res=>{const q=DB.db.transaction('kv','readwrite').objectStore('kv').put(v);q.onsuccess=q.onerror=()=>res()})},
  clear(){if(!DB.ok){this.mem.clear();return Promise.resolve()}return new Promise(res=>{const q=DB.db.transaction('kv','readwrite').objectStore('kv').clear();q.onsuccess=q.onerror=()=>res()})}};

function tone(seq){if(!P.cfg.snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;seq.forEach(([f,d,type='sine'])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.8})}catch(e){}}
const sOk=()=>{tone([[660,.09],[990,.14]]);vib(15)}, sBad=()=>{tone([[200,.18,'square']]);vib([30,40,30])}, sWin=()=>{tone([[523,.12],[659,.12],[784,.12],[1046,.3]]);vib([20,30,20,30,60])};

/* ========== XP, niveles, logros ========== */
const nivel=xp=>Math.floor(Math.sqrt(xp/100))+1;
const xpNivel=n=>Math.pow(n-1,2)*100;
function addXP(n,modo){
  const antes=nivel(P.xp);P.xp+=Math.max(0,Math.round(n));P.modos[modo]=(P.modos[modo]||0)+1;
  if(Object.keys(P.modos).length>=4)logro('cuatro');if(P.xp>=1000)logro('xp1000');
  saveP();const d=nivel(P.xp);if(d>antes)setTimeout(()=>{sWin();toast(`¡Subiste a nivel ${d}: ${NIVELES[Math.min(d-1,NIVELES.length-1)]}!`)},600);
}
function logro(id){if(P.logros.includes(id))return;P.logros.push(id);saveP();const l=LOGROS.find(x=>x.id===id);if(l)setTimeout(()=>toast(`🏅 Logro: ${l.i} ${l.n}`),300)}
function confetti(){const c=document.createElement('canvas');c.className='confetti';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext('2d');const ps=Array.from({length:90},()=>({x:Math.random()*c.width,y:-20-Math.random()*200,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,s:4+Math.random()*5,col:['#f59e0b','#06b6d4','#22c55e','#c084fc'][Math.floor(Math.random()*4)]}));let f=0;(function an(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;x.fillStyle=p.col;x.fillRect(p.x,p.y,p.s,p.s*.6)});if(++f<140)requestAnimationFrame(an);else c.remove()})()}

let G=null;const RANK=shuffle([...Array(16).keys()]);
function simStart(id){
  const sc=ESCENARIOS.find(s=>s.id===id);if(!sc)return go('sim');
  const pasos=[...sc.pasos];const ev=EVENTOS[Math.floor(Math.random()*EVENTOS.length)];pasos.splice(1+Math.floor(Math.random()*3),0,{...ev,evento:true});
  G={sc,pasos,i:0,a:50,c:35,r:25,log:[]};
  view().innerHTML=`<div class="fade card"><div class="row">${back('sim')}<span class="grow small muted">Escenario</span></div><div style="font-size:3rem;text-align:center">${sc.icono}</div><h2 style="text-align:center">${esc(sc.titulo)}</h2><p class="muted small" style="text-align:center">${esc(sc.ctx)}</p><div class="callout amber"><b>Tu objetivo:</b> ${esc(sc.obj)}</div><p class="small muted">Toma ${pasos.length} decisiones. Cada una mueve la atención, la comprensión y la retención de tu público.</p><button class="btn pri full" onclick="simStep()">Subir al escenario</button></div>`;
}
function faces(a){const n=Math.round(a/100*16),A=['😃','🙂','🤔','😮'],B=['😐','🥱','📱','😴'];return RANK.map((rk,i)=>`<span>${rk<n?A[i%4]:B[i%4]}</span>`).join('')}
function meters(){return `<div class="meters">${[['Atención','a','#f59e0b'],['Comprensión','c','#06b6d4'],['Retención','r','#22c55e']].map(([n,k,col])=>`<div class="meter"><span>${n}</span><div class="bar"><i style="width:${G[k]}%;background:${col}"></i></div><b>${Math.round(G[k])}</b></div>`).join('')}</div>`}
function simStep(){
  const st=G.pasos[G.i],ops=shuffle(st.o.map((o,k)=>({...o,k})));
  view().innerHTML=`<div class="fade"><div class="qhead">${back('sim')}<span class="small muted">${esc(G.sc.titulo)}</span><span class="mono am">${G.i+1}/${G.pasos.length}</span></div>${meters()}<div class="aud">${faces(G.a)}</div>
  <div class="card"><div class="sit">${esc(st.s)}</div><div id="ops">${ops.map(o=>`<button class="opt" data-k="${o.k}">${esc(o.t)}</button>`).join('')}</div><div id="fb"></div></div></div>`;
  $$('#ops .opt').forEach(b=>b.onclick=()=>simPick(+b.dataset.k,b));
}
function simPick(k,btn){
  const st=G.pasos[G.i],o=st.o[k],best=st.o.reduce((m,x)=>Math.max(m,x.a+x.c+x.r),-999),isBest=o.a+o.c+o.r===best;
  $$('#ops .opt').forEach(b=>{b.disabled=true;const ob=st.o[+b.dataset.k];if(ob.a+ob.c+ob.r===best)b.classList.add('ok')});if(!isBest)btn.classList.add('bad');
  // la atención amplifica lo demás: con poca atención, la comprensión sube menos
  const fa=G.a/100;G.a=clamp(G.a+o.a);G.c=clamp(G.c+(o.c>0?o.c*(0.5+fa*0.7):o.c));G.r=clamp(G.r+(o.r>0?o.r*(0.5+fa*0.7):o.r));
  G.log.push({s:st.s,t:o.t,f:o.f,best:isBest,ev:!!st.evento});
  isBest?sOk():sBad();
  const d=(v,n)=>v?`<span class="${v>0?'up':'dn'}">${v>0?'+':''}${v} ${n}</span>`:'';
  $('.meters').outerHTML=meters();$('.aud').innerHTML=faces(G.a);
  const last=G.i===G.pasos.length-1;
  $('#fb').innerHTML=`<div class="fb ${isBest?'ok':'bad'}"><b>${isBest?'¡Buena decisión!':'Hay una opción mejor.'}</b> ${esc(o.f)}<div class="delta">${d(o.a,'atención')}${d(o.c,'comprensión')}${d(o.r,'retención')}</div></div><button class="btn pri full" id="nx">${last?'Ver resultado':'Continuar →'}</button>`;
  $('#nx').onclick=()=>{if(last)simEnd();else{G.i++;simStep()}};$('#nx').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function simEnd(){
  const sc=Math.round(G.a*.3+G.c*.35+G.r*.35),stars=sc>=80?3:sc>=60?2:sc>=40?1:0,id=G.sc.id;
  const prev=P.sim[id]||{best:0,stars:0};P.sim[id]={best:Math.max(prev.best,sc),stars:Math.max(prev.stars,stars),n:(prev.n||0)+1};
  logro('debut');if(stars===3)logro('tres');if(ESCENARIOS.every(s=>P.sim[s.id]))logro('todos');
  addXP(sc,'sim');if(stars>=2){sWin();confetti()}
  const msg=stars===3?'Tu público se fue con el mensaje en la cabeza. Así se ve una charla que se queda.':stars===2?'Buena charla. Revisa las decisiones marcadas y apunta a las 3 estrellas.':stars===1?'El mensaje llegó a medias. Mira qué decisiones restaron atención al inicio.':'Como la primera charla de Rosa: nadie recordará nada. Vuelve a intentarlo con lo que aprendiste.';
  view().innerHTML=`<div class="fade"><div class="card" style="text-align:center"><div class="small muted">${esc(G.sc.titulo)}</div><div class="stars am">${'★'.repeat(stars)}<span class="muted">${'☆'.repeat(3-stars)}</span></div><div class="big-score">${sc}</div><div class="small mono muted">puntos · +${sc} XP</div>${meters()}<p class="small">${msg}</p></div>
  <div class="card"><h3>Repaso de tus decisiones</h3>${G.log.map((l,i)=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="small muted">${i+1}. ${l.ev?'Imprevisto · ':''}${esc(l.s)}</div><div>${l.best?'✅':'⚠️'} ${esc(l.t)}</div><div class="small cy">${esc(l.f)}</div></div>`).join('')}</div>
  <div class="row"><button class="btn grow" onclick="go('sim')">Escenarios</button><button class="btn pri grow" onclick="simStart('${id}')">Repetir</button></div></div>`;
}

  const sig=ZONAS[ZONAS.indexOf(z)+1];
  view().innerHTML=`<div class="fade card" style="text-align:center"><div style="font-size:4rem">${z.i}</div><h2>${z.jefe?'¡Venciste al auditorio!':'¡Zona superada!'}</h2><p>Ganaste: <b class="am">${esc(z.tok)}</b></p><p class="small muted">Vidas restantes: ${'❤️'.repeat(Z.vidas)} · ${nueva?'+'+((z.jefe?200:60)+Z.vidas*10):'+15'} XP</p>
  ${z.jefe?'<p class="small">Recorriste el camino completo de un mensaje: entra por el tálamo, pasa por la mesa de trabajo, se marca con emoción, se archiva, se consolida de noche y se convierte en conducta. Ahora ve a dar una charla real.</p>':''}
  <div class="row"><button class="btn grow" onclick="go('aventura')">Mapa</button>${sig?`<button class="btn pri grow" onclick="go('aventura/${sig.id}')">${sig.i} ${esc(sig.n)} →</button>`:''}</div></div>`;
}

/* ========== MODO 4: DUELO DE TÉCNICAS ========== */
let C=null;
function robar(){const i=C.mazo.findIndex(k=>!C.mano.includes(k));if(i<0)return C.mazo.length?C.mazo.pop():null;return C.mazo.splice(i,1)[0]}
function cartasStart(){
  const mazo=shuffle([...Object.keys(TECNICAS),...Object.keys(TECNICAS).filter(k=>!MALAS.includes(k))]);
  C={mazo,mano:[],sits:shuffle(SITUACIONES).slice(0,8),ronda:0,pts:0,combos:0,sel:[],mull:1,log:[]};
  for(let i=0;i<5;i++)C.mano.push(robar());
  view().innerHTML=`<div class="fade card"><div class="row">${back()}<span class="grow"></span></div><div style="font-size:3rem;text-align:center">🃏</div><h2 style="text-align:center">Duelo de técnicas</h2><ul class="small"><li>8 rondas. Cada ronda trae una situación de charla.</li><li>Tienes 5 cartas de técnicas. Juega <b>2</b> por ronda.</li><li>Técnica ideal: <b class="okc">+3</b>. Neutra: 0. Contraproducente: <b class="badc">−3</b>.</li><li>Algunas parejas forman <b style="color:#c084fc">combo</b> (+3 extra). Ej.: Demostración + Teach-back.</li><li>Una vez por partida puedes cambiar toda tu mano.</li></ul><p class="small muted">Ojo: en el mazo hay cartas trampa (leer el procedimiento, regañar…).</p><p class="small muted">Récord: <b class="mono am">${P.cartas.best}</b></p><button class="btn pri full" onclick="cRonda()">Repartir</button></div>`;
}
function cRonda(){
  const s=C.sits[C.ronda];C.sel=[];
  view().innerHTML=`<div class="fade"><div class="qhead">${back()}<span class="small muted">Ronda ${C.ronda+1}/8</span><span class="mono am">${C.pts} pts</span></div>
  <div class="situ"><span class="small muted">SITUACIÓN</span><b>${esc(s.t)}</b>${esc(s.d)}</div>
  <div class="hand">${C.mano.map((k,i)=>`<button class="tcard" data-i="${i}"><i>${TECNICAS[k].i}</i><b>${esc(TECNICAS[k].n)}</b></button>`).join('')}</div>
  <div class="tdesc" id="td">Toca una carta para ver qué hace. Elige 2.</div>
  <div class="row"><button class="btn grow" id="mul" ${C.mull?'':'disabled'}>🔄 Cambiar mano</button><button class="btn pri grow" id="jg" disabled>Jugar 2 cartas</button></div><div id="res"></div></div>`;
  $$('.tcard').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,k=C.mano[i];$('#td').innerHTML=`<b class="am">${TECNICAS[k].i} ${esc(TECNICAS[k].n)}:</b> ${esc(TECNICAS[k].d)}`;
    if(C.sel.includes(i)){C.sel=C.sel.filter(x=>x!==i);b.classList.remove('sel')}else if(C.sel.length<2){C.sel.push(i);b.classList.add('sel')}$('#jg').disabled=C.sel.length!==2});
  $('#mul').onclick=()=>{C.mull=0;C.mazo.unshift(...C.mano);C.mazo=shuffle(C.mazo);C.mano=[];for(let i=0;i<5;i++)C.mano.push(robar());cRonda()};
  $('#jg').onclick=cJugar;
}
function cVal(s,k){return s.b.includes(k)?3:(s.m.includes(k)||MALAS.includes(k))?-3:0}
function cJugar(){
  const s=C.sits[C.ronda],ks=C.sel.map(i=>C.mano[i]);let pts=ks.reduce((a,k)=>a+cVal(s,k),0);
  const combo=COMBOS.some(([x,y])=>(ks[0]===x&&ks[1]===y)||(ks[0]===y&&ks[1]===x))&&ks.every(k=>cVal(s,k)>=0);
  if(combo){pts+=3;C.combos++;if(C.combos>=3)logro('combo3')}
  C.pts+=pts;C.log.push({s:s.t,ks,pts,combo});
  pts>=6?sOk():pts<0?sBad():tone([[520,.08]]);
  $$('.tcard').forEach(b=>{b.disabled=true;const i=+b.dataset.i;if(C.sel.includes(i))b.classList.add(cVal(s,C.mano[i])>0?'g':cVal(s,C.mano[i])<0?'x':'sel')});
  const ideales=s.b.map(k=>TECNICAS[k].i+' '+TECNICAS[k].n).join(', ');
  $('#mul').remove();$('#jg').remove();
  $('#res').innerHTML=`${combo?'<div class="combo">⚡ ¡COMBO! +3</div>':''}<div class="fb ${pts>0?'ok':'bad'}">${ks.map(k=>{const v=cVal(s,k);return `<div>${TECNICAS[k].i} ${esc(TECNICAS[k].n)}: <b class="${v>0?'okc':v<0?'badc':''}">${v>0?'+':''}${v}</b></div>`}).join('')}<div style="margin-top:6px"><b>Total ronda: ${pts>0?'+':''}${pts}</b></div><div class="small" style="margin-top:6px">${esc(s.w)}</div><div class="small muted" style="margin-top:4px">Ideales aquí: ${esc(ideales)}</div></div><button class="btn pri full" id="nx">${C.ronda===7?'Ver resultado':'Siguiente ronda →'}</button>`;
  $('#nx').onclick=()=>{C.mano=C.mano.filter((_,i)=>!C.sel.includes(i));while(C.mano.length<5&&C.mazo.length)C.mano.push(robar());if(C.ronda===7)cEnd();else{C.ronda++;cRonda()}};
  $('#nx').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function cEnd(){
  const rec=C.pts>P.cartas.best;P.cartas.best=Math.max(P.cartas.best,C.pts);P.cartas.partidas++;if(C.pts>60)logro('cartas');
  addXP(Math.max(0,C.pts)*3,'cartas');if(C.pts>=40){sWin();confetti()}
  view().innerHTML=`<div class="fade"><div class="card" style="text-align:center"><div style="font-size:3rem">🃏</div><h2>Fin del duelo</h2><div class="big-score">${C.pts}</div><div class="mono small muted">de 72 posibles · ${C.combos} combos · +${Math.max(0,C.pts)*3} XP</div>${rec?'<p class="am"><b>🎉 ¡Nuevo récord!</b></p>':''}
  <p class="small">${C.pts>=55?'Eliges técnicas como un facilitador experto.':C.pts>=35?'Buen criterio. Fíjate en las situaciones donde sumaste poco.':'Repasa por qué cada técnica funciona: está en los capítulos 5 y 6.'}</p></div>
  <div class="card"><h3>Tus jugadas</h3>${C.log.map(l=>`<div class="row small" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="grow">${esc(l.s)}<br><span class="muted">${l.ks.map(k=>TECNICAS[k].i).join(' + ')}${l.combo?' ⚡':''}</span></span><b class="mono ${l.pts>0?'okc':'badc'}">${l.pts>0?'+':''}${l.pts}</b></div>`).join('')}</div>
  <div class="row"><button class="btn grow" onclick="go('inicio')">Inicio</button><button class="btn pri grow" onclick="cartasStart()">Otra partida</button></div></div>`;
}

/* ========== Ajustes ========== */
function vAjustes(){
  view().innerHTML=`<div class="fade"><div class="row">${back()}<h2 class="grow" style="margin:0">⚙️ Ajustes</h2></div><div class="card">
  <div class="sw"><span>Vibración</span><button class="tg ${P.cfg.vib?'on':''}" data-c="vib"></button></div>
  <div class="sw"><span>Sonido</span><button class="tg ${P.cfg.snd?'on':''}" data-c="snd"></button></div>
  <div class="sw"><span>Texto grande</span><button class="tg ${P.cfg.big?'on':''}" data-c="big"></button></div></div>
  <div class="card"><h3>Estadísticas</h3><div class="grid2"><div class="stat"><b>${P.xp}</b><span>XP total</span></div><div class="stat"><b>${Object.values(P.modos).reduce((a,b)=>a+b,0)}</b><span>Partidas</span></div><div class="stat"><b>${P.trivia.best}</b><span>Récord concurso</span></div><div class="stat"><b>${P.cartas.best}</b><span>Récord cartas</span></div></div>
  <button class="btn full" style="margin-top:12px;border-color:var(--bad);color:var(--bad)" id="rs">Reiniciar progreso del juego</button></div>
  <p class="small muted" style="text-align:center">NeuroArena v1.0</p></div>`;
  $$('.tg').forEach(b=>b.onclick=()=>{const k=b.dataset.c;P.cfg[k]=!P.cfg[k];b.classList.toggle('on',P.cfg[k]);if(k==='big')document.documentElement.classList.toggle('big',P.cfg.big);saveP()});
  $('#rs').onclick=async()=>{if(!confirm('¿Borrar XP, logros y récords?'))return;await Repo.clear();location.hash='';location.reload()};
}
Object.assign(window,{go,toast,simStep,simStart,triviaStart,tQ,zReto,cRonda,cartasStart});

/* ========== Arranque ========== */
(async()=>{
  await DB.open();const s=await Repo.get('perfil');if(s){const v=s.v;Object.assign(P,v);P.cfg={vib:true,snd:true,...v.cfg}}
  document.documentElement.classList.toggle('big',!!P.cfg.big);
  window.addEventListener('hashchange',route);route();
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
